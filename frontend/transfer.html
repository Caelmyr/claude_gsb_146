<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传下载 · DFSVS</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">上传下载</h1>
        <div class="sub" id="page-sub">分块传输 · 断点续传 · 校验和完整性 · 副本流水线</div>
      </div>
      <div class="spacer"></div>
      <label class="checkbox small" title="服务端随机失败 + 客户端随机中断，演练重试与续传">
        <input type="checkbox" id="chaos-toggle"> 混沌模式
      </label>
      <div class="userchip" id="userchip"></div>
    </header>

    <section class="content">
      <!-- 未完成会话提示 -->
      <div class="card" id="resume-banner" style="display:none;border-color:var(--warn)"></div>

      <div class="grid cols-2">
        <!-- ================= 上传 ================= -->
        <div class="card">
          <div class="card-title">⇧ 分块上传 <span class="hint">浏览器切片 → NameNode 暂存 → 分块 → 流水线 3 副本</span></div>

          <div class="dropzone" id="dropzone">
            <div style="font-size:30px">📄</div>
            点击选择或拖拽文件到此处<br>
            <span class="small">上传按分片切块、逐片校验 sha256，可随时暂停 / 断网续传</span>
            <input type="file" id="file-input" style="display:none">
          </div>

          <div id="up-form" style="display:none;margin-top:14px">
            <div class="kv" style="margin-bottom:12px">
              <span class="k">文件</span><span class="v" id="up-name"></span>
              <span class="k">大小</span><span class="v" id="up-size"></span>
            </div>
            <div class="form-row" style="margin-bottom:12px">
              <label class="fl" style="flex:1">目标目录
                <input type="text" id="up-path" value="/">
              </label>
              <label class="fl">分片大小
                <select id="up-piece">
                  <option value="32768">32 KiB</option>
                  <option value="131072">128 KiB</option>
                  <option value="262144" selected>256 KiB</option>
                  <option value="1048576">1 MiB</option>
                </select>
              </label>
            </div>

            <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
              <div class="pbar" style="flex:1"><i id="up-bar" style="width:0%"></i></div>
              <span class="mono small" id="up-pct">0%</span>
            </div>
            <div class="small muted" id="up-status">就绪</div>
            <div class="piece-grid" id="up-pieces"></div>

            <div class="btn-group" style="margin-top:14px">
              <button class="btn primary" id="up-start">开始上传</button>
              <button class="btn" id="up-pause" disabled>暂停</button>
              <button class="btn ghost" id="up-reset">清空</button>
            </div>

            <div id="up-result" style="display:none;margin-top:14px"></div>
          </div>
        </div>

        <!-- ================= 下载 ================= -->
        <div class="card">
          <div class="card-title">⇩ 多副本并行分段下载 <span class="hint">多节点同时拉不同分段 · 任一副本失败自动换节点 · 顺序拼装 + sha256 校验</span></div>

          <div class="form-row" style="margin-bottom:12px">
            <label class="fl" style="flex:1">文件路径
              <input type="text" id="dl-path" placeholder="/data/sales.csv" value="">
            </label>
            <label class="fl">分段大小
              <select id="dl-seg">
                <option value="65536">64 KiB</option>
                <option value="131072" selected>128 KiB</option>
                <option value="524288">512 KiB</option>
                <option value="1048576">1 MiB</option>
              </select>
            </label>
            <label class="fl" title="同时从不同副本节点拉取的路数（每路尽量绑定不同节点）">并发路数
              <select id="dl-workers">
                <option value="1">1（顺序）</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
              </select>
            </label>
            <button class="btn" id="dl-pick">浏览…</button>
          </div>

          <div id="dl-info" class="small muted" style="margin-bottom:10px">输入路径后点「查询」</div>
          <div class="btn-group" style="margin-bottom:12px">
            <button class="btn" id="dl-query">查询</button>
            <button class="btn primary" id="dl-start" disabled>开始并行下载</button>
            <button class="btn" id="dl-pause" disabled>暂停</button>
            <button class="btn ok" id="dl-save" disabled>保存到本地</button>
          </div>

          <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
            <div class="pbar" style="flex:1"><i id="dl-bar" style="width:0%"></i></div>
            <span class="mono small" id="dl-pct">0%</span>
          </div>
          <div class="small muted" id="dl-status">就绪</div>

          <!-- 各节点实时贡献（下载中动态更新） -->
          <div id="dl-contrib" style="margin-top:12px"></div>
          <!-- 分段来源网格：颜色=最终服务该段的节点 -->
          <div id="dl-segwrap" style="margin-top:10px;display:none">
            <div class="small muted" style="margin-bottom:4px">分段来源（颜色对应上方节点，悬停看详情）</div>
            <div class="piece-grid" id="dl-segs"></div>
          </div>
          <div id="dl-failwrap" style="margin-top:10px;display:none">
            <div class="small muted" style="margin-bottom:4px">故障转移记录 <span id="dl-failcount" class="badge warn plain" style="margin-left:4px">0</span></div>
            <div id="dl-faillog" class="trace-box small" style="max-height:120px;overflow:auto"></div>
          </div>
          <div id="dl-result" style="display:none;margin-top:12px"></div>
        </div>
      </div>

      <!-- 会话列表 -->
      <div class="card">
        <div class="card-title">进行中的上传会话 <span class="hint">（服务端暂存分片，刷新页面后可续传）</span>
          <span class="spacer"></span>
          <button class="btn xs ghost" id="sess-refresh">⟳</button>
        </div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>会话</th><th>目标</th><th>进度</th><th>分片</th><th>大小</th><th>剩余时效</th><th></th></tr></thead>
          <tbody id="sess-body"></tbody>
        </table></div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
"use strict";
const { api, esc, fmtBytes, fmtDur, toast, modal, sha256Hex, getToken } = DFSVS;

const CHAOS = () => document.getElementById("chaos-toggle").checked;

// 混沌模式开关同步到服务端（上传随机失败）
document.getElementById("chaos-toggle").onchange = async (e) => {
  try {
    await api("POST", "/api/sim/chaos", { enabled: e.target.checked });
    toast(e.target.checked ? "混沌模式开启：上传分片将随机失败" : "混沌模式关闭",
          e.target.checked ? "warn" : "ok");
  } catch (err) { toast("设置失败（需要 admin）：" + err.message, "bad"); e.target.checked = !e.target.checked; }
};

// ------------------------------------------------------------------ 上传
let upFile = null;
let upState = null;   // {session,total,piece,received:Set,paused,running,aborted}

const LS_UPLOAD = "dfsvs_upload_sessions";
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_UPLOAD) || "{}"); } catch (e) { return {}; } }
function lsSet(o) { try { localStorage.setItem(LS_UPLOAD, JSON.stringify(o)); } catch (e) {} }
function lsKey(f) { return `${f.name}:${f.size}`; }

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add("drag"); };
dropzone.ondragleave = () => dropzone.classList.remove("drag");
dropzone.ondrop = (e) => {
  e.preventDefault(); dropzone.classList.remove("drag");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files.length) setFile(fileInput.files[0]); };

function setFile(f) {
  upFile = f;
  document.getElementById("up-form").style.display = "";
  document.getElementById("up-name").textContent = f.name;
  document.getElementById("up-size").textContent = `${fmtBytes(f.size)}（${f.size} B）`;
  const path = document.getElementById("up-path");
  if (!path.value || path.value === "/") path.value = guessDir(f.name);
  document.getElementById("up-result").style.display = "none";
  renderPieces(0, 0);
  setUpStatus("就绪");
  checkResume(f);
}

function guessDir(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["png","jpg","jpeg","gif","svg","webp"].includes(ext)) return "/images";
  if (["csv","json","bin","dat","parquet"].includes(ext)) return "/data";
  if (["py","js","css","html","sh"].includes(ext)) return "/code";
  if (["md","txt","log","pdf","doc"].includes(ext)) return "/docs";
  return "/";
}

function renderPieces(total, receivedSet) {
  const box = document.getElementById("up-pieces");
  if (!total) { box.innerHTML = ""; return; }
  const shown = Math.min(total, 220);
  let html = "";
  for (let i = 0; i < shown; i++) {
    const cls = receivedSet && receivedSet.has(i) ? "done" : "";
    html += `<span class="piece ${cls}" id="pc-${i}" title="分片 ${i}">${i}</span>`;
  }
  if (total > shown) html += `<span class="piece" title="…">+${total - shown}</span>`;
  box.innerHTML = html;
}

function markPiece(i, cls) {
  const el = document.getElementById("pc-" + i);
  if (el) el.className = "piece " + cls;
}

function setUpStatus(t) { document.getElementById("up-status").textContent = t; }
function setUpPct(p) {
  document.getElementById("up-bar").style.width = p + "%";
  document.getElementById("up-pct").textContent = p.toFixed(1) + "%";
}

async function checkResume(f) {
  const saved = lsGet()[lsKey(f)];
  if (!saved || !saved.session) return;
  const banner = document.getElementById("resume-banner");
  banner.style.display = "";
  banner.innerHTML = `⚠ 检测到未完成的上传会话：<b class="mono">${esc(saved.session)}</b>
    （${esc(f.name)}，已收 ${saved.received?.length || 0}/${saved.total || "?"} 片）
    <button class="btn sm warn" id="resume-now" style="margin-left:10px">断点续传</button>
    <button class="btn sm ghost" id="resume-drop">放弃</button>`;
  document.getElementById("resume-now").onclick = () => { banner.style.display = "none"; startUpload(saved.session); };
  document.getElementById("resume-drop").onclick = () => {
    const all = lsGet(); delete all[lsKey(f)]; lsSet(all);
    banner.style.display = "none";
  };
}

document.getElementById("up-start").onclick = () => startUpload(null);
document.getElementById("up-pause").onclick = () => {
  if (upState) { upState.paused = !upState.paused;
    document.getElementById("up-pause").textContent = upState.paused ? "继续" : "暂停";
    setUpStatus(upState.paused ? "已暂停（分片保留在服务端，可续传）" : "继续上传…"); }
};
document.getElementById("up-reset").onclick = () => {
  if (upState) upState.aborted = true;
  upFile = null; upState = null;
  document.getElementById("up-form").style.display = "none";
  fileInput.value = "";
};

async function startUpload(existingSession) {
  if (!upFile) return toast("请先选择文件", "warn");
  const piece = +document.getElementById("up-piece").value;
  const path = document.getElementById("up-path").value.trim() || "/";
  document.getElementById("up-start").disabled = true;
  document.getElementById("up-pause").disabled = false;
  document.getElementById("up-pause").textContent = "暂停";

  try {
    const begin = await api("POST", "/api/upload/begin", {
      path, filename: upFile.name, size: upFile.size,
      piece_size: piece, session: existingSession || undefined,
    });
    upState = {
      session: begin.session, total: begin.total_pieces, piece: begin.piece_size,
      received: new Set(begin.received || []), paused: false, running: true, aborted: false,
    };
    // 持久化会话（刷新页面后可续传）
    const all = lsGet();
    all[lsKey(upFile)] = { session: begin.session, total: begin.total_pieces,
                           piece: begin.piece_size, path };
    lsSet(all);

    renderPieces(upState.total, upState.received);
    const t0 = performance.now();
    let retries = 0;

    for (let i = 0; i < upState.total; i++) {
      if (upState.aborted) return finishUpload("已取消", false);
      while (upState.paused) await sleep(250);
      if (upState.received.has(i)) continue;

      const start = i * upState.piece;
      const blob = upFile.slice(start, Math.min(start + upState.piece, upFile.size));
      markPiece(i, "sending");
      let ok = false;
      for (let attempt = 0; attempt < 8 && !ok; attempt++) {
        if (upState.aborted) return finishUpload("已取消", false);
        while (upState.paused) await sleep(250);
        try {
          const buf = await blob.arrayBuffer();
          // 混沌模式：客户端随机中断本次请求（模拟断网）
          if (CHAOS() && Math.random() < 0.25) throw new Error("模拟客户端断网");
          const b64 = bufToB64(buf);
          const ck = await sha256Hex(buf);
          const r = await api("POST", "/api/upload/chunk", {
            session: upState.session, index: i, data: b64, checksum: ck,
          });
          ok = r.ok;
          upState.received.add(i);
          markPiece(i, "done");
          retries = 0;
        } catch (e) {
          retries++;
          markPiece(i, "failed");
          setUpStatus(`分片 ${i} 失败（${e.message}），${0.3 * (attempt + 1)}s 后重试 …`);
          await sleep(300 * (attempt + 1));
          markPiece(i, "sending");
        }
      }
      if (!ok) return finishUpload(`分片 ${i} 重试次数用尽`, false);
      const doneCount = upState.received.size;
      setUpPct(doneCount / upState.total * 100);
      const speed = (doneCount * upState.piece) / ((performance.now() - t0) / 1000);
      setUpStatus(`上传中 ${doneCount}/${upState.total} 片 · ${fmtBytes(speed)}/s${retries ? ` · 累计重试 ${retries}` : ""}`);
    }

    setUpStatus("所有分片就绪，服务端合并 → 分块 → 流水线复制 3 副本 …");
    const r = await api("POST", "/api/upload/complete", { session: upState.session });
    const all2 = lsGet(); delete all2[lsKey(upFile)]; lsSet(all2);
    finishUpload("完成", true, r);
  } catch (e) {
    finishUpload("失败：" + e.message, false);
  }
}

function finishUpload(msg, ok, result) {
  document.getElementById("up-start").disabled = false;
  document.getElementById("up-pause").disabled = true;
  if (upState) upState.running = false;
  setUpStatus(msg);
  if (ok && result) {
    setUpPct(100);
    const f = result.file;
    document.getElementById("up-result").style.display = "";
    document.getElementById("up-result").innerHTML = `
      <div class="trace-box">
        <div class="step">✅ 上传完成：<b>${esc(f.path)}</b></div>
        <div class="step">分片 ${result.pieces} 个 → 系统块 ${result.blocks} 个（64KiB 定长分块）· 去重命中 ${result.dedup_hits}</div>
        <div class="step">耗时 ${result.elapsed_s}s · 端到端吞吐 ${result.throughput_mbps} MB/s</div>
        <div class="step">内容哈希 <span class="mono">${esc(f.content_hash.slice(0, 32))}…</span></div>
        <div class="step"><a href="files.html?path=${encodeURIComponent(f.path.split("/").slice(0, -1).join("/") || "/")}">在文件浏览中查看 →</a></div>
      </div>`;
    toast(`上传完成：${f.path}`, "ok");
    loadSessions();
  } else if (!ok) {
    toast(msg, "bad", 5000);
  }
}

function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 单段请求超时：避免某副本节点挂起（非快速失败）时一路永久卡死，
// 超时与混沌中断一样算作该路失败 -> 自动改用其它副本节点补齐。
const SEGMENT_TIMEOUT_MS = 12000;

// ------------------------------------------------------------------ 下载
let dlInfo = null;
let dlState = null;   // 并行下载状态机，见 startDownload 内初始化

// 节点配色：同一节点在贡献面板/分段网格中始终同色
const NODE_COLORS = ["#4f8cff", "#2fbf71", "#f0a538", "#e5534b",
                     "#9b6cff", "#39bcd0", "#ff7eb6", "#7ee787"];
const NODE_FALLBACK_COLOR = "#6f7890";
const nodeColor = new Map();
function colorFor(node) {
  if (!node) return NODE_FALLBACK_COLOR;
  if (!nodeColor.has(node))
    nodeColor.set(node, NODE_COLORS[nodeColor.size % NODE_COLORS.length]);
  return nodeColor.get(node);
}

document.getElementById("dl-query").onclick = async () => {
  const path = document.getElementById("dl-path").value.trim();
  if (!path) return toast("请输入文件路径", "warn");
  try {
    dlInfo = await api("GET", "/api/download/info?path=" + encodeURIComponent(path));
    nodeColor.clear();
    (dlInfo.live_nodes || []).forEach(colorFor);
    const live = dlInfo.live_nodes || [];
    document.getElementById("dl-info").innerHTML = `
      <b>${esc(dlInfo.name)}</b> · ${fmtBytes(dlInfo.size)} · ${esc(dlInfo.mime)} ·
      ${dlInfo.blocks.length} 块 · 在线副本节点 <span class="mono">${esc(live.join(", ") || "无")}</span> ·
      sha256 <span class="mono">${esc((dlInfo.content_hash_full || dlInfo.content_hash || "").slice(0, 20))}…</span>
      <div class="small" style="margin-top:4px">副本分布：${dlInfo.blocks.map(b =>
        `<span class="chip" title="${esc(b.id)}">${esc(b.checksum.slice(0, 6))}→[${esc(b.replicas.join(","))}]</span>`).join(" ")}</div>`;
    // 并发路数默认取「有副本的存活节点数」与选项的较小值，保证多路真来自不同节点
    if (live.length) {
      const sel = document.getElementById("dl-workers");
      const want = Math.max(1, Math.min(live.length, 4));
      sel.value = String(want);
    }
    document.getElementById("dl-start").disabled = dlInfo.size === 0;
    document.getElementById("dl-result").style.display = "none";
    document.getElementById("dl-contrib").innerHTML = "";
    document.getElementById("dl-segwrap").style.display = "none";
    document.getElementById("dl-failwrap").style.display = "none";
  } catch (e) {
    dlInfo = null;
    document.getElementById("dl-info").textContent = "查询失败：" + e.message;
    document.getElementById("dl-start").disabled = true;
  }
};

document.getElementById("dl-pick").onclick = async () => {
  const tree = await api("GET", "/api/fs/tree");
  const files = [];
  (function walk(n, p) {
    const cp = p === "/" ? "" : p;
    if (n.type === "file") files.push({ path: cp + "/" + n.name, size: n.size });
    (n.children || []).forEach(c => walk(c, cp + "/" + n.name));
  })(tree.tree, "/");
  const body = document.createElement("div");
  body.innerHTML = `<div class="scroll-y" style="max-height:56vh">${files.map((f, i) => `
    <div class="t-node" data-i="${i}" style="padding:6px 8px">
      <span>🗎</span><span class="mono small">${esc(f.path)}</span>
      <span class="ts muted small">${fmtBytes(f.size)}</span>
    </div>`).join("") || '<div class="empty">没有文件</div>'}</div>`;
  const m = modal({
    title: "选择要下载的文件", body, hideCancel: true, okText: "关闭", wide: true,
  });
  body.querySelectorAll(".t-node").forEach(el => el.onclick = () => {
    document.getElementById("dl-path").value = files[+el.dataset.i].path;
    m.close();
    document.getElementById("dl-query").click();
  });
};

document.getElementById("dl-start").onclick = () => startDownload();
document.getElementById("dl-pause").onclick = () => {
  if (!dlState) return;
  dlState.paused = !dlState.paused;
  document.getElementById("dl-pause").textContent = dlState.paused ? "继续" : "暂停";
  setDlStatus(dlState.paused ? "已暂停（已完成分段保留在内存，可继续）" : "继续下载…");
};

function setDlStatus(t) { document.getElementById("dl-status").textContent = t; }
function setDlPct(p) {
  document.getElementById("dl-bar").style.width = p + "%";
  document.getElementById("dl-pct").textContent = p.toFixed(1) + "%";
}

// 查询某一文件字节区间落在哪些块上、哪些存活好副本可读 -> 候选节点集合。
// topology 为可选的实时存活节点快照（下载中周期性刷新），用于剔除刚故障的节点。
function nodesForRange(info, segStart, segEnd, topology) {
  const set = new Set();
  for (const b of info.blocks) {
    const bEnd = b.offset + b.size - 1;
    if (bEnd < segStart || b.offset > segEnd) continue;
    for (const r of (b.replica_detail || [])) {
      if (!r.readable) continue;
      if (topology && !topology.has(r.node)) continue;
      set.add(r.node);
    }
  }
  return [...set];
}

/**
 * 拉取一个分段（含自动故障转移重试）。
 * 每轮让 NN 优先走 prefer 节点；该路失败（节点被杀/块损坏/混沌中断）时
 * 自动换候选清单中的其它节点补齐；所有节点都失败则抛出，由调度器重排队。
 * 返回 { buf, nodeBytes:Map, attempts:[{node,ok,err,failover}] }
 */
async function fetchSegment(path, seg, candidates, chaosSignal = null) {
  const attempts = [];
  let lastErr = null;
  for (let round = 0; round < Math.max(2, candidates.length + 1); round++) {
    const prefer = candidates[round % candidates.length];
    // 每次尝试独立的控制器：上一次超时/中断不能影响故障转移到下一节点
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), SEGMENT_TIMEOUT_MS);
    // 混沌信号只作用于首跳；若它先触发则让本次 fetch 立即失败
    const onChaos = () => ctrl.abort();
    if (round === 0 && chaosSignal) {
      if (chaosSignal.aborted) ctrl.abort();
      else chaosSignal.addEventListener("abort", onChaos, { once: true });
    }
    try {
      const url = `/api/download?path=${encodeURIComponent(path)}`
        + `&offset=${seg.start}&length=${seg.len}&node=${encodeURIComponent(prefer)}`;
      const resp = await fetch(url, {
        headers: { Authorization: "Bearer " + getToken() },
        signal: ctrl.signal,
      });
      if (!resp.ok && resp.status !== 206) throw new Error("HTTP " + resp.status);
      const buf = await resp.arrayBuffer();
      if (buf.byteLength !== seg.len) throw new Error(`长度不符 ${buf.byteLength}/${seg.len}`);
      // 真实贡献以服务端 X-Node-Bytes 为准（分段跨界时可能由多节点拼成）
      const nodeBytes = new Map();
      (resp.headers.get("X-Node-Bytes") || "").split(";").filter(Boolean)
        .forEach(pair => {
          const [n, bytes] = pair.split(":");
          nodeBytes.set(n, (nodeBytes.get(n) || 0) + (+bytes || 0));
        });
      const failedOver = resp.headers.get("X-Failover") === "1";
      const servedBy = [...nodeBytes.keys()];
      attempts.push({ node: prefer, servedBy, ok: true, failover: failedOver });
      return { buf, nodeBytes, servedBy, attempts };
    } catch (e) {
      lastErr = e;
      const reason = e.name === "AbortError" ? "请求超时/中断" : e.message;
      attempts.push({ node: prefer, ok: false, err: reason });
    } finally {
      clearTimeout(timer);
      if (round === 0 && chaosSignal)
        chaosSignal.removeEventListener("abort", onChaos);
    }
  }
  const err = new Error(`分段 ${seg.index} 全部副本尝试失败：${lastErr?.message || lastErr}`);
  err.attempts = attempts;
  throw err;
}

function buildSegments(size, segSize) {
  const total = Math.max(1, Math.ceil(size / segSize));
  const segs = [];
  for (let i = 0; i < total; i++) {
    const start = i * segSize;
    segs.push({ index: i, start, len: Math.min(segSize, size - start) });
  }
  return segs;
}

function renderSegGrid(state) {
  const box = document.getElementById("dl-segs");
  const shown = Math.min(state.segments.length, 240);
  let html = "";
  for (let i = 0; i < shown; i++) {
    const r = state.results[i];
    const seg = state.segments[i];
    let cls = "", style = "", title = `分段 ${i} @${fmtBytes(seg.start)}-${fmtBytes(seg.start + seg.len - 1)}`;
    if (r && r.ok) {
      const nodes = [...r.nodeBytes.keys()];
      const main = nodes.sort((a, b) => r.nodeBytes.get(b) - r.nodeBytes.get(a))[0];
      const c = colorFor(main);
      cls = "done";
      style = `background:${hexA(c, .28)};border-color:${c};color:${c}`;
      title += "\n来自 " + nodes.map(n => `${n}:${fmtBytes(r.nodeBytes.get(n))}`).join(" ");
      if (r.failedOver) title += "\n（发生故障转移）";
    } else if (state.inflight.has(i)) {
      cls = "sending";
      const node = state.inflight.get(i);
      if (node) { const c = colorFor(node); style = `border-color:${c};color:${c}`; }
      title += `\n拉取中… 首选 ${node || "?"}`;
    } else if (r && r.error) {
      cls = "failed";
      title += "\n失败：" + r.error;
    }
    html += `<span class="piece ${cls}" style="${style}" title="${esc(title)}">${i}</span>`;
  }
  if (state.segments.length > shown)
    html += `<span class="piece" title="…">+${state.segments.length - shown}</span>`;
  box.innerHTML = html;
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// 各节点实时贡献：下载过程中随分段完成持续刷新（字节数 + 占比条 + 分段数）
function renderContrib(state) {
  const box = document.getElementById("dl-contrib");
  const bytesByNode = state.bytesByNode;
  const segsByNode = state.segsByNode;
  const inflightByNode = state.inflightByNode;
  const total = state.doneBytes || 1;
  const nodes = [...new Set([
    ...Object.keys(bytesByNode), ...Object.keys(inflightByNode),
  ])].sort();
  if (!nodes.length) {
    box.innerHTML = `<div class="small muted">等待各节点开始贡献数据 …</div>`;
    return;
  }
  box.innerHTML = nodes.map(n => {
    const bytes = bytesByNode[n] || 0;
    const segs = segsByNode[n] || 0;
    const flying = inflightByNode[n] || 0;
    const pct = bytes / total * 100;
    const c = colorFor(n);
    return `
    <div style="margin-bottom:7px">
      <div class="small" style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:6px"></span><b class="mono">${esc(n)}</b>
          <span class="muted">· ${fmtBytes(bytes)} · ${pct.toFixed(1)}% · ${segs} 段${flying ? ` · 拉取中 ${flying}` : ""}</span></span>
        <span class="mono muted">${pct.toFixed(1)}%</span>
      </div>
      <div class="pbar thin"><i style="width:${pct.toFixed(2)}%;background:${c}"></i></div>
    </div>`;
  }).join("");
}

function addFailLog(state, segIndex, prefer, err, recoveredNode) {
  state.failovers.push({ segIndex, prefer, err, recoveredNode });
  document.getElementById("dl-failcount").textContent = state.failovers.length;
  const wrap = document.getElementById("dl-failwrap");
  wrap.style.display = "";
  const log = document.getElementById("dl-faillog");
  const div = document.createElement("div");
  div.className = "step";
  div.style.padding = "2px 0";
  div.innerHTML = recoveredNode
    ? `段 #${segIndex}：<b>${esc(prefer)}</b> 失败（${esc(err)}）→ 自动改用 <b style="color:${colorFor(recoveredNode)}">${esc(recoveredNode)}</b> 补齐 ✓`
    : `段 #${segIndex}：<b>${esc(prefer)}</b> 失败（${esc(err)}），重新排队`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function startDownload() {
  if (!dlInfo) return;
  const seg = Math.max(1, +document.getElementById("dl-seg").value || 131072);
  const workers = Math.max(1, Math.min(
    +document.getElementById("dl-workers").value || 4, dlInfo.max_workers || 8));
  const path = dlInfo.path || document.getElementById("dl-path").value.trim();

  // 暂停后继续：复用已完成的分段结果（按段号索引，顺序天然不乱）。
  // 分段大小/文件变了则旧结果作废，按全新任务开始，避免段表错位与越界。
  const resume = !!(dlState && dlState.partial && dlState.path === path
                    && dlState.segSize === seg && dlState.fileSize === dlInfo.size);
  const segments = buildSegments(dlInfo.size, seg);
  const results = (resume && dlState.results.length === segments.length)
    ? dlState.results : new Array(segments.length).fill(null);
  const doneSet = new Set();
  let doneBytes = 0;
  results.forEach((r, i) => {
    if (r && r.ok) { doneSet.add(i); doneBytes += r.buf.byteLength; }
  });

  dlState = {
    path, partial: true, paused: false, aborted: false, finished: false,
    segSize: seg, fileSize: dlInfo.size,
    segments, results, doneSet, doneBytes,
    inflight: new Map(),          // segIndex -> 当前首选节点
    inflightByNode: {},           // node -> 在途段数（调度负载）
    bytesByNode: resume ? dlState.bytesByNode : {},
    segsByNode: resume ? dlState.segsByNode : {},
    failovers: resume ? dlState.failovers : [],
    nextSeg: 0, workers, retries: resume ? dlState.retries || 0 : 0,
  };

  document.getElementById("dl-start").disabled = true;
  document.getElementById("dl-pause").disabled = false;
  document.getElementById("dl-save").disabled = true;
  document.getElementById("dl-pause").textContent = "暂停";
  document.getElementById("dl-segwrap").style.display = "";
  if (dlState.failovers.length) document.getElementById("dl-failwrap").style.display = "";
  document.getElementById("dl-faillog").innerHTML = "";
  if (resume) {
    dlState.failovers.forEach(f => {
      const log = document.getElementById("dl-faillog");
      const div = document.createElement("div");
      div.className = "step"; div.style.padding = "2px 0";
      div.innerHTML = f.recoveredNode
        ? `段 #${f.segIndex}：<b>${esc(f.prefer)}</b> 失败（${esc(f.err)}）→ <b>${esc(f.recoveredNode)}</b> 补齐 ✓`
        : `段 #${f.segIndex}：<b>${esc(f.prefer)}</b> 失败（${esc(f.err)}）`;
      log.appendChild(div);
    });
  }
  setDlPct(doneBytes / dlInfo.size * 100);
  renderContrib(dlState);
  renderSegGrid(dlState);

  const t0 = performance.now();

  // 实时存活拓扑：下载中周期刷新，某节点中途死亡后立即从候选与首选中剔除
  let liveTopology = new Set(dlInfo.live_nodes || []);
  let topologyUpdating = null;
  async function refreshTopology() {
    if (topologyUpdating) return topologyUpdating;
    topologyUpdating = (async () => {
      try {
        const view = await api("GET", "/api/nodes");
        const live = new Set((view.nodes || [])
          .filter(n => n.state === "LIVE").map(n => n.node_id));
        if (live.size) liveTopology = live;
        dlInfo.live_nodes = [...live];
      } catch (e) { /* 刷新失败沿用上次拓扑 */ }
    })().finally(() => { topologyUpdating = null; });
    return topologyUpdating;
  }
  const topologyTimer = setInterval(refreshTopology, 2000);

  // 稳定地把 worker 路绑定到不同的存活副本节点（按持有副本数降序）
  const replicaCount = {};
  dlInfo.blocks.forEach(b => b.replicas.forEach(n =>
    replicaCount[n] = (replicaCount[n] || 0) + 1));
  const allNodes = (dlInfo.live_nodes || [])
    .slice()
    .sort((a, b) => (replicaCount[b] || 0) - (replicaCount[a] || 0));
  const workerNodes = allNodes.slice(0, workers);

  // ---- 分段 -> 首选副本节点的预分配（轮转各段候选，尽量均衡到不同节点）----
  const queues = new Map();            // node -> [segIndex]（该路的专属队列）
  workerNodes.forEach(n => queues.set(n, []));
  const retryQ = [];                   // [{idx, after}] 失败后任意路可补
  let cursor = 0;
  for (let i = 0; i < segments.length; i++) {
    if (dlState.doneSet.has(i)) continue;
    const s = segments[i];
    const cands = nodesForRange(dlInfo, s.start, s.start + s.len - 1, liveTopology);
    const owner = cands.length
      ? cands[cursor++ % cands.length]
      : (workerNodes[cursor++ % workerNodes.length] || null);
    if (owner && queues.has(owner)) queues.get(owner).push(i);
    else retryQ.push({ idx: i, after: 0 });
  }

  function hasWork() {
    if (dlState.doneSet.size >= segments.length) return false;
    if (dlState.inflight.size > 0) return true;
    if (retryQ.length) return true;
    for (const q of queues.values())
      if (q.some(i => !dlState.doneSet.has(i))) return true;
    return false;
  }

  // 认领下一段：先拿本路专属队列，再偷其它路的尾段，最后取公共重试队列。
  // 被认领段必须在实时拓扑里有可读副本，否则跳过（其原属主可能刚死亡）。
  function claim(workerNode) {
    const eligible = idx => {
      const s = segments[idx];
      const cands = nodesForRange(dlInfo, s.start, s.start + s.len - 1,
                                  liveTopology);
      if (!cands.length) return null;
      // 被偷来的段若其属主读不了，就退回候选首位，避免空指
      let prefer = workerNode;
      if (!prefer || !cands.includes(prefer)) prefer = cands[0];
      dlState.inflight.set(idx, prefer);
      if (prefer)
        dlState.inflightByNode[prefer] = (dlState.inflightByNode[prefer] || 0) + 1;
      return { idx, prefer, cands };
    };
    const mine = workerNode && queues.get(workerNode);
    if (mine) {
      while (mine.length) {
        const idx = mine.shift();
        if (dlState.doneSet.has(idx)) continue;
        const job = eligible(idx);
        if (job) return job;
        // 本路固定节点读不了此段 -> 放回公共重试队列，让其它存活路补
        retryQ.push({ idx, after: performance.now() + 400 });
      }
    }
    for (const [n, q] of queues) {
      if (n === workerNode) continue;
      while (q.length) {
        const idx = q.shift();
        if (dlState.doneSet.has(idx)) continue;
        const job = eligible(idx);
        if (job) return job;
        retryQ.push({ idx, after: performance.now() + 400 });
      }
    }
    for (let k = 0; k < retryQ.length; k++) {
      if (retryQ[k].after > performance.now()) continue;
      const [{ idx }] = retryQ.splice(k, 1);
      if (dlState.doneSet.has(idx)) continue;
      const job = eligible(idx);
      if (job) return job;
      // 暂时全副本不可读（刚杀节点等待拓扑/恢复）：稍后再试
      retryQ.push({ idx, after: performance.now() + 800 });
      return null;
    }
    return null;
  }

  let active = 0;
  let resolveAll;
  const allDone = new Promise(r => { resolveAll = r; });

  async function pump(workerNode) {
    active++;
    try {
      while (!dlState.aborted && hasWork()) {
        if (dlState.paused) { await sleep(300); continue; }
        const job = claim(workerNode);
        if (!job) {
          // 仅剩冷却中的重试段：等其解冻；没有在途任务时也要让出 CPU
          if (dlState.inflight.size === 0) await sleep(350);
          else await sleep(60);
          continue;
        }
        const { idx, prefer, cands } = job;
        const s = segments[idx];
        const ordered = [prefer, ...cands.filter(n => n && n !== prefer)]
          .filter((n, i, arr) => n && arr.indexOf(n) === i);
        // 混沌模式：仅打断首跳（模拟偶发网络抖动），后续故障转移尝试不受影响
        let chaosSignal = null;
        if (CHAOS() && Math.random() < 0.25) {
          const c = new AbortController();
          chaosSignal = c.signal;
          setTimeout(() => c.abort(), 40 + Math.random() * 260);
        }
        try {
          const r = await fetchSegment(
            path, s, ordered.length ? ordered : (cands.length ? cands : [prefer]),
            chaosSignal);
          // 首选失败但最终成功 -> 故障转移日志（不影响整体进度）
          const failedAttempts = r.attempts.filter(a => !a.ok);
          if (failedAttempts.length) {
            dlState.retries += failedAttempts.length;
            addFailLog(dlState, idx, failedAttempts[0].node,
                       failedAttempts[0].err || "读取失败", r.servedBy[0]);
          } else if (r.attempts.some(a => a.failover)) {
            // 客户端首选节点可用，但 NameNode 内部发现该副本损坏/读失败而转移
            dlState.retries += 1;
            const a0 = r.attempts.find(a => a.failover);
            addFailLog(dlState, idx, a0.node,
                       "服务端副本读失败，已自动转移", r.servedBy[0]);
          }
          results[idx] = { ok: true, buf: r.buf, nodeBytes: r.nodeBytes,
                           servedBy: r.servedBy,
                           failedOver: r.attempts.some(a => !a.ok || a.failover) };
          r.nodeBytes.forEach((b, n) => {
            dlState.bytesByNode[n] = (dlState.bytesByNode[n] || 0) + b;
            dlState.segsByNode[n] = (dlState.segsByNode[n] || 0) + 1;
          });
          dlState.doneSet.add(idx);
          dlState.doneBytes += r.buf.byteLength;
        } catch (e) {
          addFailLog(dlState, idx, prefer || "?", e.message, null);
          dlState.retries++;
          // 任何一路彻底失败：把该段放回公共队列，由其它存活节点的路补齐
          retryQ.push({ idx, after: performance.now() + 300 + Math.random() * 500 });
          await sleep(200);
        } finally {
          const pinned = dlState.inflight.get(idx);
          if (pinned && dlState.inflightByNode[pinned] > 0)
            dlState.inflightByNode[pinned]--;
          dlState.inflight.delete(idx);
          renderSegGrid(dlState);
          renderContrib(dlState);
          setDlPct(dlState.doneBytes / dlInfo.size * 100);
          const speed = dlState.doneBytes / ((performance.now() - t0) / 1000);
          setDlStatus(`并行下载中 ${fmtBytes(dlState.doneBytes)} / ${fmtBytes(dlInfo.size)}`
            + ` · ${fmtBytes(speed)}/s · ${workers} 路并行 · 完成 ${dlState.doneSet.size}/${segments.length} 段`);
        }
      }
    } finally {
      active--;
      if (active === 0) resolveAll();
    }
  }

  // 启动 worker 路（每路绑定一个副本节点；路数多于节点数时复用节点）
  const pumps = [];
  for (let w = 0; w < workers; w++)
    pumps.push(pump(workerNodes.length ? workerNodes[w % workerNodes.length] : null));
  await allDone;
  clearInterval(topologyTimer);

  document.getElementById("dl-start").disabled = false;
  document.getElementById("dl-pause").disabled = true;
  if (dlState.aborted) { setDlStatus("已取消"); return; }
  if (dlState.doneSet.size < segments.length) {
    setDlStatus("暂停中（已完成分段保留，可继续）");
    return;
  }

  // ---- 顺序拼装（results 按段号排列，并行完成顺序不影响最终字节序）----
  setDlStatus("全部分段就位，按序拼装并校验 sha256 …");
  const merged = new Uint8Array(dlInfo.size);
  let pos = 0;
  for (let i = 0; i < results.length; i++) {
    merged.set(new Uint8Array(results[i].buf), pos);
    pos += results[i].buf.byteLength;
  }

  const hash = await sha256Hex(merged.buffer);
  const expect = dlInfo.content_hash_full || dlInfo.content_hash;
  const okHash = hash === expect;
  dlState.buffer = merged;
  dlState.partial = false;
  document.getElementById("dl-save").disabled = !okHash;
  const box = document.getElementById("dl-result");
  box.style.display = "";
  const contrib = Object.entries(dlState.bytesByNode)
    .sort((a, b) => b[1] - a[1])
    .map(([n, b]) => `<span style="color:${colorFor(n)}"><b>${esc(n)}</b> ${fmtBytes(b)}（${(b / dlInfo.size * 100).toFixed(1)}%）</span>`)
    .join("　");
  box.innerHTML = `
    <div class="trace-box">
      <div class="step">${okHash ? "✅" : "❌"} 完整性校验：拼装后本地 sha256 ${okHash ? "与原文件一致" : "不一致！"}</div>
      <div class="step mono small">${esc(hash.slice(0, 48))}…</div>
      <div class="step">${segments.length} 个分段 · ${workers} 路并行 · 故障转移/重试 ${dlState.retries} 次</div>
      <div class="step">节点最终贡献：${contrib}</div>
    </div>`;
  setDlStatus(okHash ? "下载完成 ✓（多副本并行，校验通过，字节序与原文件一致）"
                     : "下载完成但校验失败，请重试");
  toast(okHash ? "并行下载完成，sha256 校验通过" : "校验失败！", okHash ? "ok" : "bad");
  renderSegGrid(dlState);
  renderContrib(dlState);
}

document.getElementById("dl-save").onclick = () => {
  if (!dlState || !dlState.buffer) return;
  const blob = new Blob([dlState.buffer], { type: dlInfo.mime || "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = dlInfo.name || "download.bin";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

// ------------------------------------------------------------------ 会话
async function loadSessions() {
  try {
    const d = await api("GET", "/api/upload/sessions");
    const body = document.getElementById("sess-body");
    if (!d.sessions.length) {
      body.innerHTML = `<tr><td colspan="7" class="empty small">暂无进行中的会话</td></tr>`;
      return;
    }
    body.innerHTML = d.sessions.map(s => `
      <tr>
        <td class="mono small">${esc(s.session)}</td>
        <td class="mono small">${esc(s.path)}/${esc(s.filename)}</td>
        <td style="min-width:120px">
          <div class="pbar thin"><i style="width:${s.total_pieces ? (s.received_count / s.total_pieces * 100) : 0}%"></i></div>
        </td>
        <td class="num">${s.received_count}/${s.total_pieces}</td>
        <td class="num">${fmtBytes(s.size)}</td>
        <td class="num">${fmtDur(s.expires_in)}</td>
        <td>${s.completed ? '<span class="badge ok plain">已完成</span>' : '<span class="badge warn plain">进行中</span>'}</td>
      </tr>`).join("");
  } catch (e) { /* 忽略 */ }
}
document.getElementById("sess-refresh").onclick = loadSessions;

initPage("transfer.html", "上传下载").then(() => {
  const p = DFSVS.qs("path");
  if (p) { document.getElementById("dl-path").value = p; document.getElementById("dl-query").click(); }
  loadSessions();
  DFSVS.poll(loadSessions, 5000);
});
